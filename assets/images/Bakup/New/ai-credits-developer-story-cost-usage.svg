<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Credits Developer Story: From Unfocused Prompts to Engineering Value</title>
  <desc id="desc">A LinkedIn-ready infographic showing how prompting without visibility can burn AI Credits, while focused prompts, scoped context, model choice, validation, and measurement turn AI usage into engineering value.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06142e"/>
      <stop offset="0.5" stop-color="#0b5cab"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0" r="70%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
    <style>
      .bg{fill:#020617}.hero{fill:url(#hero)}.panel{fill:#0f172a;stroke:#334155;stroke-width:2;filter:url(#shadow)}.soft{fill:#111827;stroke:#475569;stroke-width:2}.bad{fill:#fff7ed;stroke:#fed7aa;stroke-width:2}.good{fill:#ecfdf5;stroke:#a7f3d0;stroke-width:2}.title{font-family:Segoe UI,Arial,sans-serif;font-size:56px;font-weight:900;fill:#fff;letter-spacing:-1px}.subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:25px;fill:#dbeafe}.eyebrow{font-family:Segoe UI,Arial,sans-serif;font-size:19px;font-weight:850;letter-spacing:3px;fill:#bfdbfe}.h2{font-family:Segoe UI,Arial,sans-serif;font-size:31px;font-weight:900;fill:#fff}.h3{font-family:Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#e0f2fe}.body{font-family:Segoe UI,Arial,sans-serif;font-size:20px;fill:#cbd5e1}.small{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#94a3b8}.darkText{font-family:Segoe UI,Arial,sans-serif;font-size:20px;fill:#1f2937}.badText{font-family:Segoe UI,Arial,sans-serif;font-size:22px;font-weight:850;fill:#b45309}.goodText{font-family:Segoe UI,Arial,sans-serif;font-size:22px;font-weight:850;fill:#0f766e}.white{font-family:Segoe UI,Arial,sans-serif;font-size:21px;font-weight:850;fill:#fff}.kpi{font-family:Segoe UI,Arial,sans-serif;font-size:21px;font-weight:850;fill:#d1fae5}.cost{font-family:Segoe UI,Arial,sans-serif;font-size:21px;font-weight:850;fill:#ffedd5}.footer{font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#94a3b8}.line{stroke:#38bdf8;stroke-width:5;stroke-linecap:round}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:8 10}.coin{fill:#fbbf24;stroke:#f59e0b;stroke-width:3}.coinText{font-family:Segoe UI,Arial,sans-serif;font-size:24px;font-weight:900;fill:#78350f}.bubble{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <path d="M0 760 C230 650 380 785 620 680 C920 550 1110 690 1600 560 L1600 900 L0 900 Z" fill="#0b1220" opacity="0.9"/>

  <rect x="55" y="42" width="1490" height="178" rx="34" class="hero" filter="url(#shadow)"/>
  <text x="95" y="99" class="eyebrow">AI CREDITS • COST AWARENESS • DEVELOPER PRODUCTIVITY</text>
  <text x="95" y="158" class="title">AI Credits Tell a Developer Story</text>
  <text x="95" y="202" class="subtitle">The same AI tool can either burn budget through unfocused prompts or create measurable engineering value.</text>

  <rect x="70" y="260" width="680" height="430" rx="30" class="panel"/>
  <text x="105" y="315" class="h2">Scene 1: Prompting Without Visibility</text>
  <text x="105" y="352" class="small">A developer asks broad questions with too much context and no validation plan.</text>

  <g transform="translate(105 392)">
    <circle cx="70" cy="75" r="54" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <circle cx="55" cy="62" r="7" fill="#e2e8f0"/>
    <circle cx="85" cy="62" r="7" fill="#e2e8f0"/>
    <path d="M50 92 Q70 78 90 92" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <rect x="28" y="128" width="84" height="76" rx="22" fill="#334155"/>
    <text x="0" y="230" class="small">“Scan the repo and improve everything.”</text>
  </g>

  <g transform="translate(310 385)">
    <rect x="0" y="0" width="365" height="72" rx="20" class="bubble"/>
    <text x="24" y="30" class="darkText">Huge repository context</text>
    <text x="24" y="56" class="darkText">No scope, no success criteria</text>
    <rect x="0" y="92" width="365" height="72" rx="20" class="bubble"/>
    <text x="24" y="122" class="darkText">Advanced model for routine task</text>
    <text x="24" y="148" class="darkText">Long output, hard to review</text>
    <rect x="0" y="184" width="365" height="72" rx="20" class="bubble"/>
    <text x="24" y="214" class="darkText">No test, metric, or review loop</text>
    <text x="24" y="240" class="darkText">Low confidence in changes</text>
  </g>

  <g transform="translate(100 625)">
    <rect x="0" y="0" width="600" height="48" rx="24" fill="url(#danger)"/>
    <text x="28" y="32" class="white">Result: high AI Credit usage, low signal, weak engineering confidence</text>
  </g>

  <line x1="770" y1="475" x2="830" y2="475" class="line"/>
  <polygon points="835,475 815,462 815,488" fill="#38bdf8"/>

  <rect x="850" y="260" width="680" height="430" rx="30" class="panel"/>
  <text x="885" y="315" class="h2">Scene 2: Engineering With AI Credits</text>
  <text x="885" y="352" class="small">The developer treats AI usage like cloud resources: scoped, measured, and validated.</text>

  <g transform="translate(885 390)">
    <circle cx="70" cy="75" r="54" fill="#0f766e" stroke="#5eead4" stroke-width="4"/>
    <circle cx="55" cy="62" r="7" fill="#ecfeff"/>
    <circle cx="85" cy="62" r="7" fill="#ecfeff"/>
    <path d="M50 88 Q70 104 92 88" fill="none" stroke="#ecfeff" stroke-width="5" stroke-linecap="round"/>
    <rect x="28" y="128" width="84" height="76" rx="22" fill="#115e59"/>
    <text x="0" y="230" class="small">“Review this service for N+1 queries.”</text>
  </g>

  <g transform="translate(1090 382)">
    <rect x="0" y="0" width="390" height="56" rx="18" class="good"/>
    <text x="24" y="36" class="goodText">1. Focused prompt + selected files</text>
    <rect x="0" y="70" width="390" height="56" rx="18" class="good"/>
    <text x="24" y="106" class="goodText">2. Right model for task complexity</text>
    <rect x="0" y="140" width="390" height="56" rx="18" class="good"/>
    <text x="24" y="176" class="goodText">3. Ask for evidence and trade-offs</text>
    <rect x="0" y="210" width="390" height="56" rx="18" class="good"/>
    <text x="24" y="246" class="goodText">4. Validate with tests and metrics</text>
  </g>

  <g transform="translate(880 625)">
    <rect x="0" y="0" width="610" height="48" rx="24" fill="url(#success)"/>
    <text x="30" y="32" class="white">Result: lower waste, faster review, measurable engineering value</text>
  </g>

  <rect x="100" y="724" width="1400" height="94" rx="28" class="soft"/>
  <text x="135" y="764" class="h3">Cost-effective AI Credit pattern</text>
  <text x="135" y="798" class="body">Small context → right model → specific output → human review → tests/metrics → reusable team workflow</text>

  <g transform="translate(1220 725)">
    <circle cx="34" cy="34" r="28" class="coin"/><text x="25" y="43" class="coinText">¢</text>
    <circle cx="83" cy="34" r="28" class="coin"/><text x="74" y="43" class="coinText">¢</text>
    <circle cx="132" cy="34" r="28" class="coin"/><text x="123" y="43" class="coinText">¢</text>
    <text x="0" y="78" class="small">Credits become investment</text>
  </g>

  <text x="70" y="860" class="footer">Better question: not “How many AI Credits did we use?” but “What engineering value did those credits create?” • Showkath • linkedin.com/in/showkath</text>
</svg>
