<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Credits: Responsibilities, Cost Governance, and Engineering Value</title>
  <desc id="desc">A manager-friendly infographic showing how developers, technical leads, engineering managers, cost center owners, and enterprise architects share responsibility for AI Credits, cost governance, prompt quality, validation, and measurable engineering value.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062f5f"/>
      <stop offset="0.52" stop-color="#0b5cab"/>
      <stop offset="1" stop-color="#31a8ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.17"/>
    </filter>
    <style>
      .bg{fill:#f5f7fb}.hero{fill:url(#hero)}.card{fill:#fff;stroke:#d9e2ef;stroke-width:2;filter:url(#shadow)}.soft{fill:#f8fbff;stroke:#cfe7ff;stroke-width:2;filter:url(#shadow)}.blue{fill:#0b5cab}.green{fill:url(#green)}.line{stroke:#9cc8f5;stroke-width:5;stroke-linecap:round}.dash{stroke:#d9e2ef;stroke-width:3;stroke-dasharray:8 10}.title{font-family:Segoe UI,Arial,sans-serif;font-size:54px;font-weight:850;fill:#fff}.subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:26px;fill:#e6f3ff}.eyebrow{font-family:Segoe UI,Arial,sans-serif;font-size:19px;font-weight:850;letter-spacing:3.2px;fill:#c9e8ff}.h2{font-family:Segoe UI,Arial,sans-serif;font-size:30px;font-weight:850;fill:#063f79}.h3{font-family:Segoe UI,Arial,sans-serif;font-size:23px;font-weight:850;fill:#12385f}.body{font-family:Segoe UI,Arial,sans-serif;font-size:20px;fill:#314155}.small{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#5f6b7a}.whiteH{font-family:Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#fff}.num{font-family:Segoe UI,Arial,sans-serif;font-size:26px;font-weight:900;fill:#0b5cab}.kpi{font-family:Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f766e}.footer{font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#5f6b7a}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <circle cx="1515" cy="95" r="260" fill="#31a8ff" opacity="0.13"/>
  <circle cx="60" cy="825" r="260" fill="#0b5cab" opacity="0.08"/>

  <rect x="55" y="44" width="1490" height="180" rx="34" class="hero" filter="url(#shadow)"/>
  <text x="95" y="99" class="eyebrow">MANAGER QUICK READ • ENTERPRISE AI GOVERNANCE</text>
  <text x="95" y="158" class="title">Enterprise AI Credits: Cost, Responsibility &amp; Value</text>
  <text x="95" y="202" class="subtitle">Do not measure AI only by monthly usage. Measure the engineering value created by each AI-assisted workflow.</text>

  <rect x="70" y="258" width="430" height="272" rx="26" class="card"/>
  <text x="105" y="307" class="h2">Shared Responsibilities</text>
  <text x="105" y="343" class="small">Different stakeholders manage different risks.</text>
  <g transform="translate(105 376)">
    <circle cx="15" cy="13" r="13" class="blue"/><text x="42" y="20" class="body">Developers: focused prompts + validation</text>
    <circle cx="15" cy="53" r="13" class="blue"/><text x="42" y="60" class="body">Tech leads: templates + workflows</text>
    <circle cx="15" cy="93" r="13" class="blue"/><text x="42" y="100" class="body">Managers: productivity + quality metrics</text>
    <circle cx="15" cy="133" r="13" class="blue"/><text x="42" y="140" class="body">Cost owners: ROI + usage trends</text>
    <circle cx="15" cy="173" r="13" class="blue"/><text x="42" y="180" class="body">Architects: governance + standards</text>
  </g>

  <rect x="535" y="258" width="530" height="272" rx="26" class="card"/>
  <text x="570" y="307" class="h2">Cost Governance Loop</text>
  <text x="570" y="343" class="small">A practical operating model for AI Credits.</text>
  <g transform="translate(590 382)">
    <rect x="0" y="0" width="140" height="58" rx="29" fill="#eef7ff" stroke="#cfe7ff" stroke-width="2"/>
    <text x="34" y="36" class="h3" style="font-size:21px">Scope</text>
    <line x1="145" y1="29" x2="205" y2="29" class="line"/>
    <polygon points="205,29 190,18 190,40" class="blue"/>
    <rect x="215" y="0" width="140" height="58" rx="29" fill="#eef7ff" stroke="#cfe7ff" stroke-width="2"/>
    <text x="252" y="36" class="h3" style="font-size:21px">Model</text>
    <line x1="285" y1="64" x2="285" y2="105" class="line"/>
    <polygon points="285,107 274,92 296,92" class="blue"/>
    <rect x="215" y="114" width="140" height="58" rx="29" fill="#ecfdf5" stroke="#b7eadf" stroke-width="2"/>
    <text x="241" y="151" class="h3" style="font-size:21px">Validate</text>
    <line x1="210" y1="143" x2="150" y2="143" class="line"/>
    <polygon points="150,143 165,132 165,154" class="blue"/>
    <rect x="0" y="114" width="140" height="58" rx="29" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="35" y="151" class="h3" style="font-size:21px">Value</text>
    <line x1="70" y1="108" x2="70" y2="66" class="line"/>
    <polygon points="70,64 59,79 81,79" class="blue"/>
  </g>

  <rect x="1100" y="258" width="430" height="272" rx="26" class="card"/>
  <text x="1135" y="307" class="h2">Manager KPIs</text>
  <text x="1135" y="343" class="small">Useful signals beyond AI spend.</text>
  <g transform="translate(1135 379)">
    <text x="0" y="0" class="kpi">✓ Time saved</text>
    <text x="0" y="39" class="kpi">✓ Defects prevented</text>
    <text x="0" y="78" class="kpi">✓ Faster onboarding</text>
    <text x="0" y="117" class="kpi">✓ Review efficiency</text>
  </g>

  <rect x="70" y="570" width="710" height="238" rx="28" class="soft"/>
  <text x="105" y="620" class="h2">Team A vs. Team B</text>
  <line x1="105" y1="646" x2="745" y2="646" class="dash"/>
  <g transform="translate(105 682)">
    <rect x="0" y="0" width="270" height="86" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="24" y="34" class="h3">Team A</text>
    <text x="24" y="62" class="small">Broad scans, ad hoc prompts</text>
    <rect x="330" y="0" width="270" height="86" rx="18" fill="#ecfdf5" stroke="#b7eadf" stroke-width="2"/>
    <text x="354" y="34" class="h3">Team B</text>
    <text x="354" y="62" class="small">Targeted prompts, reusable patterns</text>
    <text x="0" y="130" class="body">Outcome: lower consumption, easier validation, predictable cost, stronger knowledge sharing.</text>
  </g>

  <rect x="820" y="570" width="710" height="238" rx="28" class="card"/>
  <text x="855" y="620" class="h2">AI Usage Maturity</text>
  <g transform="translate(855 660)">
    <rect x="0" y="0" width="620" height="28" rx="14" fill="#e5eef8"/>
    <rect x="0" y="0" width="124" height="28" rx="14" fill="#dbeafe"/>
    <rect x="124" y="0" width="124" height="28" fill="#bfdbfe"/>
    <rect x="248" y="0" width="124" height="28" fill="#93c5fd"/>
    <rect x="372" y="0" width="124" height="28" fill="#5eead4"/>
    <rect x="496" y="0" width="124" height="28" rx="14" fill="#14b8a6"/>
    <text x="28" y="65" class="num">1</text><text x="64" y="65" class="small">Experiment</text>
    <text x="151" y="65" class="num">2</text><text x="187" y="65" class="small">Standardize</text>
    <text x="279" y="65" class="num">3</text><text x="315" y="65" class="small">Optimize</text>
    <text x="405" y="65" class="num">4</text><text x="441" y="65" class="small">Govern</text>
    <text x="526" y="65" class="num">5</text><text x="562" y="65" class="small">Engineer</text>
    <text x="0" y="115" class="body">Target: AI integrated into the SDLC with measurable productivity, quality, and governance.</text>
  </g>

  <rect x="305" y="828" width="990" height="48" rx="24" class="green"/>
  <text x="380" y="859" class="whiteH" style="font-size:22px">Better KPI: “How much engineering value did those AI Credits create?”</text>
  <text x="70" y="862" class="footer">Showkath • linkedin.com/in/showkath</text>
</svg>
