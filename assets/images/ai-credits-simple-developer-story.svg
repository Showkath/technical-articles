<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Credits: From Prompting Blindly to Engineering Value</title>
  <desc id="desc">A simple LinkedIn infographic comparing unfocused AI prompting with cost-aware engineering prompts, showing developer icons, dollar and euro symbols, examples, and outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06142e"/>
      <stop offset="0.55" stop-color="#0b5cab"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
    <style>
      .title{font-family:Segoe UI,Arial,sans-serif;font-size:56px;font-weight:900;fill:#fff;letter-spacing:-1px}.subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:25px;fill:#dbeafe}.eyebrow{font-family:Segoe UI,Arial,sans-serif;font-size:18px;font-weight:850;letter-spacing:3px;fill:#bfdbfe}.cardTitle{font-family:Segoe UI,Arial,sans-serif;font-size:34px;font-weight:900;fill:#10233f}.body{font-family:Segoe UI,Arial,sans-serif;font-size:24px;fill:#263445}.small{font-family:Segoe UI,Arial,sans-serif;font-size:20px;fill:#475569}.label{font-family:Segoe UI,Arial,sans-serif;font-size:23px;font-weight:850;fill:#fff}.badText{font-family:Segoe UI,Arial,sans-serif;font-size:25px;font-weight:850;fill:#b45309}.goodText{font-family:Segoe UI,Arial,sans-serif;font-size:25px;font-weight:850;fill:#0f766e}.footer{font-family:Segoe UI,Arial,sans-serif;font-size:19px;fill:#dbeafe}.coin{fill:#fbbf24;stroke:#d97706;stroke-width:4}.coinText{font-family:Segoe UI,Arial,sans-serif;font-size:30px;font-weight:900;fill:#78350f}.card{filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="260" fill="#ffffff" opacity="0.08"/>
  <circle cx="120" cy="820" r="260" fill="#ffffff" opacity="0.07"/>

  <text x="80" y="92" class="eyebrow">AI CREDITS • COST AWARENESS • DEVELOPER PRODUCTIVITY</text>
  <text x="80" y="158" class="title">AI Credits: Prompting Blindly vs Engineering Value</text>
  <text x="80" y="205" class="subtitle">The same AI assistant can waste budget or create measurable value — depending on how developers use it.</text>

  <rect x="80" y="255" width="680" height="480" rx="34" fill="url(#bad)" class="card"/>
  <rect x="840" y="255" width="680" height="480" rx="34" fill="url(#good)" class="card"/>

  <g transform="translate(620 300)">
    <circle cx="38" cy="38" r="34" fill="#334155"/>
    <text x="15" y="47" class="small" style="fill:#f8fafc;font-weight:850">DEV</text>
  </g>
  <text x="130" y="340" class="cardTitle">Prompting Without Visibility</text>
  <text x="130" y="385" class="small">Broad prompts + huge context + no validation</text>

  <text x="130" y="445" class="badText">Examples</text>
  <text x="160" y="490" class="body">• “Find performance issues.”</text>
  <text x="160" y="530" class="body">• “Scan the entire repository.”</text>
  <text x="160" y="570" class="body">• “Rewrite this service.”</text>

  <text x="130" y="630" class="badText">Outcome</text>
  <text x="160" y="675" class="body">Higher $/€ usage, noisy output, hard review.</text>

  <rect x="500" y="610" width="200" height="44" rx="22" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <text x="524" y="639" class="badText" style="font-size:20px">$/€ at risk</text>

  <g transform="translate(1380 300)">
    <circle cx="38" cy="38" r="34" fill="#0f766e"/>
    <text x="15" y="47" class="small" style="fill:#ecfeff;font-weight:850">DEV</text>
  </g>
  <text x="890" y="340" class="cardTitle">Engineering With AI Credits</text>
  <text x="890" y="385" class="small">Focused prompts + right model + evidence + validation</text>

  <text x="890" y="445" class="goodText">Better Prompt Examples</text>
  <text x="920" y="490" class="body">• “Review OrderService for N+1 queries.”</text>
  <text x="920" y="530" class="body">• “Find performance risks in this method only.”</text>
  <text x="920" y="570" class="body">• “Suggest minimal safe changes with evidence.”</text>

  <text x="890" y="630" class="goodText">Outcome</text>
  <text x="920" y="675" class="body">Lower waste, faster review, measurable value.</text>

  <rect x="1260" y="610" width="210" height="44" rx="22" fill="#a7f3d0" stroke="#0f766e" stroke-width="2"/>
  <text x="1282" y="639" class="goodText" style="font-size:20px">$/€ invested</text>

  <rect x="250" y="775" width="1100" height="58" rx="29" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.28)"/>
  <text x="300" y="812" class="label">Better KPI: “How much engineering value did those AI Credits create?”</text>

  <text x="80" y="870" class="footer">Showkath • linkedin.com/in/showkath • AI Credits should be treated like an engineering investment, not just a usage number.</text>
</svg>
