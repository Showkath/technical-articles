<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How text and code become tokens</title>
  <desc id="desc">A whiteboard-style diagram showing that prompts, code, file names, symbols, and chat context are split into tokens before an AI model processes them.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:#fbfdff}.board{fill:#fff;stroke:#cfe0f5;stroke-width:3;filter:url(#shadow)}.card{fill:#f8fbff;stroke:#9cc8f5;stroke-width:3}.token{fill:#eef6ff;stroke:#31a8ff;stroke-width:2}.code{fill:#0d1117}.title{font-family:Segoe UI,Arial,sans-serif;font-size:38px;font-weight:850;fill:#063f79}.label{font-family:Segoe UI,Arial,sans-serif;font-size:24px;font-weight:800;fill:#12385f}.text{font-family:Segoe UI,Arial,sans-serif;font-size:21px;fill:#314155}.small{font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#5f6b7a}.mono{font-family:SFMono-Regular,Consolas,monospace;font-size:23px;fill:#e6edf3}.tokenText{font-family:SFMono-Regular,Consolas,monospace;font-size:19px;font-weight:700;fill:#063f79}.arrow{stroke:#0b5cab;stroke-width:5;stroke-linecap:round;fill:none}.dash{stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 10;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <rect class="board" x="36" y="34" width="1128" height="552" rx="28"/>
  <text class="title" x="70" y="92">What is a token?</text>
  <text class="small" x="70" y="126">A token is a small unit of text or code the model processes. It is not always the same as one word.</text>

  <rect class="card" x="70" y="170" width="360" height="300" rx="22"/>
  <text class="label" x="100" y="218">Your input</text>
  <rect class="code" x="100" y="248" width="300" height="138" rx="16"/>
  <text class="mono" x="124" y="292">const userId =</text>
  <text class="mono" x="124" y="330">req.params.id;</text>
  <text class="small" x="100" y="426">Prompt + code + files + chat history</text>

  <path class="arrow" d="M455 318 H575"/>
  <path d="M590 318 L560 300 L560 336 Z" fill="#0b5cab"/>

  <rect class="card" x="610" y="170" width="520" height="300" rx="22"/>
  <text class="label" x="640" y="218">Tokenized pieces</text>
  <g transform="translate(640 252)">
    <rect class="token" x="0" y="0" width="88" height="42" rx="14"/><text class="tokenText" x="18" y="28">const</text>
    <rect class="token" x="102" y="0" width="96" height="42" rx="14"/><text class="tokenText" x="118" y="28">user</text>
    <rect class="token" x="212" y="0" width="62" height="42" rx="14"/><text class="tokenText" x="232" y="28">Id</text>
    <rect class="token" x="288" y="0" width="44" height="42" rx="14"/><text class="tokenText" x="304" y="28">=</text>
    <rect class="token" x="0" y="62" width="66" height="42" rx="14"/><text class="tokenText" x="15" y="90">req</text>
    <rect class="token" x="80" y="62" width="44" height="42" rx="14"/><text class="tokenText" x="96" y="90">.</text>
    <rect class="token" x="138" y="62" width="104" height="42" rx="14"/><text class="tokenText" x="154" y="90">params</text>
    <rect class="token" x="256" y="62" width="44" height="42" rx="14"/><text class="tokenText" x="272" y="90">.</text>
    <rect class="token" x="314" y="62" width="46" height="42" rx="14"/><text class="tokenText" x="329" y="90">id</text>
    <rect class="token" x="374" y="62" width="44" height="42" rx="14"/><text class="tokenText" x="390" y="90">;</text>
  </g>
  <path class="dash" d="M670 424 C760 500 950 500 1060 424"/>
  <text class="small" x="684" y="464">More context usually means more tokens to process.</text>
  <text class="small" x="70" y="528">Key idea: token count depends on the tokenizer, language, code structure, and context provided.</text>
</svg>